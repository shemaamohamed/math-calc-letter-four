<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الرياضية الدقيقة - Arbitrary-Precision Calculator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 1.2rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0.8rem 2rem;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.3rem;
            color: var(--gold);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        th {
            background: #0f172a;
            color: var(--accent-color);
        }

        .highlight-box {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
            margin-top: 0.5rem;
            font-family: monospace;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: var(--gold);
            color: #000;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>الحاسبة الرياضية الدقيقة (Arbitrary-Precision arithmetic)</h1>
            <p>حساب الجمل والنسب المئوية والكسور الدقيقة في بيئة JavaScript دقيقة 100%</p>
        </header>

        <div class="input-card">
            <input type="text" id="wordInput" value="مدد" placeholder="أدخل النص/الكلمة هنا...">
            <button onclick="calculate()">احسب الآن</button>
        </div>

        <div class="results-section" id="outputArea">
            <!-- Output dynamically rendered -->
        </div>
    </div>

    <script src="arabic_calculator.js"></script>
    <script>
        function calculate() {
            const val = document.getElementById('wordInput').value;
            if (!val.trim()) return;

            const res = processWord(val);
            const output = document.getElementById('outputArea');

            let stepsHTML = '';
            res.step3.forEach(item => {
                stepsHTML += `
                    <tr>
                        <td>${item.pos}</td>
                        <td>${item.char}</td>
                        <td>${item.letterSumStep2}</td>
                        <td>${item.percentageDisplay} (${item.percentageFraction})</td>
                        <td>${item.termFraction}</td>
                    </tr>
                `;
            });

            output.innerHTML = `
                <div class="card">
                    <h2>📋 تفاصيل الخطوات الخوارزمية (3 خطوات)</h2>
                    <p><strong>النص المدخل:</strong> ${res.wordInput}</p>
                    <p><strong>الأحرف بعد التوحيد:</strong> ${res.normalizedChars.join(' ، ')}</p>

                    <table>
                        <thead>
                            <tr>
                                <th>الخانة (الخطوة 1: عد طبيعي)</th>
                                <th>الحرف</th>
                                <th>الخطوة 2 (مجموع الحرف)</th>
                                <th>النسبة المئوية (الخطوة 3)</th>
                                <th>الناتج الجزئي (Term Fraction)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stepsHTML}
                        </tbody>
                    </table>
                    <br>
                    <div class="highlight-box">
                        <strong>الناتج الكسري النهائي (Exact Fraction):</strong> <span class="badge">${res.finalFraction}</span>
                    </div>
                </div>

                <div class="card">
                    <h2>🟨 الجواب الأول: سكوير (الجذر التربيعي) على الناتج النهائي</h2>
                    <div class="highlight-box">
                        <p><strong>صيغة الجذر للكسر:</strong> ${res.answer1.exactFraction}</p>
                        <p><strong>القيمة بعد العلامة (.):</strong> ${res.answer1.fullDisplay10}</p>
                        <p><strong>أول 10 أرقام بعد العلامة (.):</strong> ${res.answer1.first10Digits}</p>
                        <p><strong>خطوات الاختزال الرقمي (Digit Sum):</strong> ${res.answer1.digitSumSteps.join(' ➔ ')}</p>
                        <p><strong>الرقم المفرد النهائي:</strong> <span class="badge">${res.answer1.singleDigit}</span></p>
                    </div>
                </div>

                <div class="card">
                    <h2>🟨 الجواب الثاني: تقسيم الناتج على عدد الحروف + سكوير</h2>
                    <div class="highlight-box">
                        <p><strong>التقسيم على عدد الحروف (${res.totalChars}):</strong> ${res.answer2.baseFraction}</p>
                        <p><strong>صيغة الجذر:</strong> ${res.answer2.exactFraction}</p>
                        <p><strong>القيمة بعد العلامة (.):</strong> ${res.answer2.fullDisplay10}</p>
                        <p><strong>أول 10 أرقام بعد العلامة (.):</strong> ${res.answer2.first10Digits}</p>
                        <p><strong>خطوات الاختزال الرقمي (Digit Sum):</strong> ${res.answer2.digitSumSteps.join(' ➔ ')}</p>
                        <p><strong>الرقم المفرد النهائي:</strong> <span class="badge">${res.answer2.singleDigit}</span></p>
                    </div>
                </div>
            `;
        }

        // Run calculation on load
        window.onload = calculate;
    </script>
</body>
</html>
