<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الرياضية الدقيقة - Arbitrary-Precision Calculator (5 Steps & 4 Gates)</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131b2e;
            --accent-color: #a855f7;
            --accent-hover: #9333ea;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --border-color: #243049;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        header h1 {
            color: #c084fc;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #090d16;
            color: #fff;
            font-size: 1.2rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn-primary:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.25rem;
            color: #c084fc;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
            min-width: 600px;
        }

        th, td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        th {
            background: #090d16;
            color: #c084fc;
            font-size: 0.85rem;
        }

        .highlight-box {
            background: #090d16;
            padding: 1rem;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
            margin-top: 0.5rem;
            font-family: monospace;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: var(--gold);
            color: #000;
            border-radius: 4px;
            font-weight: bold;
        }

        .gates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1rem;
        }

        .gate-card {
            background: #111827;
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .gate-card.gold { border-color: rgba(245, 158, 11, 0.4); }
        .gate-card.cyan { border-color: rgba(6, 182, 212, 0.4); }
        .gate-card.purple { border-color: rgba(168, 85, 247, 0.4); }
        .gate-card.emerald { border-color: rgba(16, 185, 129, 0.4); }

        .gate-title {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .gate-card.gold .gate-title { color: var(--gold); }
        .gate-card.cyan .gate-title { color: var(--cyan); }
        .gate-card.purple .gate-title { color: #c084fc; }
        .gate-card.emerald .gate-title { color: var(--emerald); }

        .gate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gate-root {
            font-size: 1.4rem;
            font-weight: 900;
            padding: 0.2rem 0.8rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-btn {
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .toggle-btn.active {
            background: #10b981;
            color: #fff;
            border-color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>الحاسبة الرياضية الدقيقة (Arbitrary-Precision 5 Steps)</h1>
            <p>خوارزمية الحساب الكسري الدقيق وبوابات الإجابات الأربعة</p>
        </header>

        <div class="input-card">
            <input type="text" id="wordInput" value="جليل" placeholder="أدخل النص/الكلمة هنا...">
            <button class="btn-primary" onclick="calculate()">بدء الحساب</button>
        </div>

        <div class="results-section" id="outputArea">
            <!-- Output dynamically rendered -->
        </div>
    </div>

    <script src="arabic_calculator.js"></script>
    <script>
        let selectedIndices = [0, 1, 2]; // default to first 3 cells like handwritten example

        function toggleCell(idx) {
            if (selectedIndices.includes(idx)) {
                selectedIndices = selectedIndices.filter(i => i !== idx);
            } else {
                selectedIndices.push(idx);
            }
            calculate(true);
        }

        function calculate(keepSelection = false) {
            const val = document.getElementById('wordInput').value;
            if (!val.trim()) return;

            if (!keepSelection) {
                // select all by default if new word
                const clean = val.replace(/[\u064B-\u0652\u0640]/g, '').trim();
                selectedIndices = clean.split('').map((_, i) => i);
            }

            const res = processWord(val, selectedIndices);
            const output = document.getElementById('outputArea');

            let stepsHTML = '';
            res.step5Details.forEach((item, idx) => {
                const isChecked = item.isSelected;
                stepsHTML += `
                    <tr style="${isChecked ? 'background: rgba(16, 185, 129, 0.1);' : 'opacity: 0.6;'}">
                        <td>${item.pos} (قيمة: ${item.step1})</td>
                        <td><strong>${item.char}</strong></td>
                        <td dir="ltr">${item.step2}</td>
                        <td dir="ltr">${item.step3}</td>
                        <td dir="ltr">${item.step4Group}</td>
                        <td dir="ltr">${item.percentage}</td>
                        <td dir="ltr" style="color: #10b981; font-weight: bold;">${item.finalValue}</td>
                        <td>
                            <button class="toggle-btn ${isChecked ? 'active' : ''}" onclick="toggleCell(${idx})">
                                ${isChecked ? '✓ منتقلة' : 'انتقال'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            output.innerHTML = `
                <div class="card">
                    <h2>📋 جدول التحليل والخطوات الخمس (القسم الأول)</h2>
                    <p><strong>النص المدخل:</strong> ${res.wordInput} | <strong>الأحرف بعد التوحيد:</strong> ${res.normalizedChars.join(' ، ')}</p>
                    <p><strong>S1:</strong> ${res.S1} | <strong>S2:</strong> ${res.S2} | <strong>الخانات المحددة (N):</strong> ${res.selectedCount} | <strong>المجموع الكسري (S):</strong> <span class="badge">${res.sumS}</span></p>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>الخانة (خطوة 1: ×4)</th>
                                    <th>الحرف</th>
                                    <th>خطوة 2 (تقسيم وضرب)</th>
                                    <th>خطوة 3 (كسر قياسي)</th>
                                    <th>خطوة 4 (المجموع ÷ الخانات)</th>
                                    <th>النسبة % (خطوة 5)</th>
                                    <th>الناتج الجزئي النهائي</th>
                                    <th>زر الانتقال</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${stepsHTML}
                            </tbody>
                        </table>
                    </div>
                </div>

                <h2>🟨 بوابات النتائج الأربعة (القسم الثاني)</h2>
                <div class="gates-grid">
                    <!-- Answer 1 -->
                    <div class="gate-card gold">
                        <div class="gate-title">🏆 الجواب الأول (√S - أول 10 أرقام كاملة)</div>
                        <div class="gate-item"><span>صيغة الكسر:</span><span dir="ltr">${res.answer1.exactFraction}</span></div>
                        <div class="gate-item"><span>10 أرقام المستخرجة:</span><span dir="ltr">${res.answer1.fullDisplay10}</span></div>
                        <div class="gate-item"><span>خطوات الاختزال:</span><span dir="ltr">${res.answer1.digitSumSteps.join(' ➔ ')}</span></div>
                        <div class="gate-item"><span>الرقم المفرد النهائي:</span><span class="gate-root" style="color: var(--gold);">${res.answer1.singleDigit}</span></div>
                    </div>

                    <!-- Answer 2 -->
                    <div class="gate-card cyan">
                        <div class="gate-title">✨ الجواب الثاني (√(S/N) - أول 10 أرقام كاملة)</div>
                        <div class="gate-item"><span>التقسيم على N:</span><span dir="ltr">${res.answer2.baseFormula}</span></div>
                        <div class="gate-item"><span>صيغة الجذر:</span><span dir="ltr">${res.answer2.exactFraction}</span></div>
                        <div class="gate-item"><span>10 أرقام المستخرجة:</span><span dir="ltr">${res.answer2.fullDisplay10}</span></div>
                        <div class="gate-item"><span>خطوات الاختزال:</span><span dir="ltr">${res.answer2.digitSumSteps.join(' ➔ ')}</span></div>
                        <div class="gate-item"><span>الرقم المفرد النهائي:</span><span class="gate-root" style="color: var(--cyan);">${res.answer2.singleDigit}</span></div>
                    </div>

                    <!-- Answer 3 -->
                    <div class="gate-card purple">
                        <div class="gate-title">⚡ الجواب الثالث (√S - أول 10 بعد الفاصلة .)</div>
                        <div class="gate-item"><span>صيغة الكسر:</span><span dir="ltr">${res.answer3.exactFraction}</span></div>
                        <div class="gate-item"><span>10 أرقام بعد (.):</span><span dir="ltr">${res.answer3.fullDisplay10}</span></div>
                        <div class="gate-item"><span>خطوات الاختزال:</span><span dir="ltr">${res.answer3.digitSumSteps.join(' ➔ ')}</span></div>
                        <div class="gate-item"><span>الرقم المفرد النهائي:</span><span class="gate-root" style="color: #c084fc;">${res.answer3.singleDigit}</span></div>
                    </div>

                    <!-- Answer 4 -->
                    <div class="gate-card emerald">
                        <div class="gate-title">🔢 الجواب الرابع (√(S/N) - أول 10 بعد الفاصلة .)</div>
                        <div class="gate-item"><span>التقسيم على N:</span><span dir="ltr">${res.answer4.baseFormula}</span></div>
                        <div class="gate-item"><span>صيغة الجذر:</span><span dir="ltr">${res.answer4.exactFraction}</span></div>
                        <div class="gate-item"><span>10 أرقام بعد (.):</span><span dir="ltr">${res.answer4.fullDisplay10}</span></div>
                        <div class="gate-item"><span>خطوات الاختزال:</span><span dir="ltr">${res.answer4.digitSumSteps.join(' ➔ ')}</span></div>
                        <div class="gate-item"><span>الرقم المفرد النهائي:</span><span class="gate-root" style="color: var(--emerald);">${res.answer4.singleDigit}</span></div>
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            // initial load with cells 0, 1, 2 checked for "جليل"
            calculate(true);
        };
    </script>
</body>
</html>
